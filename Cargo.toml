[workspace]
members = ["crates/pkl-runtime", "crates/pkl-wasm", "crates/pkl-napi", "xtask"]
resolver = "3"
exclude = ["vendor/java_regex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
java_regex = { path = "vendor/java_regex" }
