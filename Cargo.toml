[workspace]
members = [
    "crates/pkl-runtime",
    "crates/pkl-host-native",
    "crates/pkl",
    "crates/pkl-cli",
    "crates/pkl-formatter",
    "crates/pkl-server",
    "crates/pkl-repl",
    "crates/pkl-doc",
    "crates/pkl-wasm",
    "crates/pkl-napi",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.32.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/openedges/pkl-rs"
homepage = "https://github.com/openedges/pkl-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package.pkl-runtime]
opt-level = 2

[profile.test.package.pkl-runtime]
opt-level = 2
