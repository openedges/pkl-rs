[package]
name = "pkl-runtime"
description = "Shared Rust runtime for the Pkl 0.32.0 compatibility project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pkl", "apple-pkl", "configuration", "config", "wasm"]
categories = ["config", "parsing", "wasm"]
publish = true
exclude = ["tests/**", "examples/**"]

[dependencies]
libm = { version = "0.2.16", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
# Native Host examples/tests use the JDK 21 Unicode 15.0 normalization tables.
unicode-normalization = { version = "0.1.22", default-features = false }

[lints]
workspace = true
