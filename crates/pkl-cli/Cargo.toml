[package]
name = "pkl-cli"
description = "Product `pkl` CLI binary for Apple Pkl 0.32.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pkl", "apple-pkl", "cli", "configuration", "config"]
categories = ["config", "command-line-utilities"]
publish = true
exclude = ["tests/**"]

[[bin]]
name = "pkl"
path = "src/bin/pkl.rs"

[dependencies]
pkl.workspace = true
pkl-formatter.workspace = true
pkl-host-native.workspace = true
pkl-repl.workspace = true
pkl-runtime.workspace = true
pkl-server.workspace = true

[lints]
workspace = true
