[package]
name = "pkl-napi"
description = "Node.js N-API bindings for the shared Pkl 0.32.0 runtime and native host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
pkl.workspace = true
pkl-formatter.workspace = true
pkl-host-native.workspace = true
pkl-runtime.workspace = true
napi = { version = "=3.4.0", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "=3.3.0"
napi-derive-backend = "=3.0.0"
napi-sys = "=3.0.1"

[build-dependencies]
napi-build = "=2.2.4"

[lints]
workspace = true
