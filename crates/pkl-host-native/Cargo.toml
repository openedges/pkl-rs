[package]
name = "pkl-host-native"
description = "Native OS host adapter (filesystem, modulepath, HTTP/TLS, cancellation) for pkl-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pkl", "apple-pkl", "configuration", "config"]
categories = ["config", "network-programming"]
publish = true
exclude = ["tests/**"]

[dependencies]
pkl-runtime.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
unicode-normalization = { version = "=0.1.22", default-features = false }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
