[package]
name = "pkl-rs"
description = "Public Rust evaluator API for Apple Pkl 0.32.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pkl", "apple-pkl", "configuration", "config"]
categories = ["config", "parsing"]
publish = true
exclude = ["examples/**"]

[lib]
name = "pkl"
path = "src/lib.rs"

[dependencies]
pkl-host-native.workspace = true
pkl-runtime.workspace = true

[lints]
workspace = true
