[package]
name = "pkl-doc"
description = "HTML documentation generator (`pkldoc`) for Pkl 0.32.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pkl", "apple-pkl", "pkldoc", "documentation", "cli"]
categories = ["config", "command-line-utilities", "development-tools"]
publish = true
exclude = ["tests/**"]

[[bin]]
name = "pkldoc"
path = "src/bin/pkldoc.rs"

[dependencies]
pkl-host-native.workspace = true
pkl-runtime.workspace = true

[lints]
workspace = true
