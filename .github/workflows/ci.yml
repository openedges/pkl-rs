name: CI

# Minimal, low-cost Ubuntu-only CI for push / pull_request:
# - Static verification, formatting, lint, Wasm compilation, manifest freshness,
#   and fast Rust unit/product tests.
# - Release-mode packaging smoke for @pkl-rs/wasm, @pkl-rs/napi, pkl, and pkldoc.
#
# Expensive Java differential suites (M0-M6), Playwright cross-browser matrices,
# seeded differential fuzzing, long-running memory soak, and full 34-workload
# benchmarks run in the local/dedicated verification environment via
# `python3 tools/local_verify.py` (see docs/ci.md).
# Cross-platform macOS/Windows/Linux release packaging runs only in release.yml
# on version tags (`v*`) or manual dispatch.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Minimal checks, manifests, and fast Rust tests (Ubuntu x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ci-check-${{ runner.os }}-
      - name: Verify pinned reference sources
        run: cargo xtask verify
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace, regex crate, and Wasm target
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p java_regex --lib --locked -- -D warnings
          cargo clippy -p pkl-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Check portable Wasm crates
        run: cargo check -p pkl-runtime -p pkl-formatter -p pkl-wasm --target wasm32-unknown-unknown --locked
      - name: Check milestone manifests, contracts, and local verifier tests
        run: |
          python3 tools/inventory.py --check
          python3 tools/discover.py --check
          python3 tools/smoke_manifest.py --check
          python3 tools/regression_manifest.py --check
          python3 tools/m2_manifest.py --check
          python3 tools/m2_module_eval.py --check
          python3 tools/m2_jvm_classpath.py --check
          python3 tools/m3_manifest.py --check
          python3 tools/m4_manifest.py --check
          python3 tools/m5_manifest.py --check
          python3 tools/m6_manifest.py --check
          python3 tools/m7_manifest.py --check
          python3 tools/benchmark.py --check-contract
          python3 tools/m7_benchmark.py --check-contract
          PYTHONPATH=tools python3 -m unittest -v tools/tests/test_local_verify.py
      - name: Run fast Rust unit and product-crate smoke tests
        run: |
          cargo test -p xtask -p pkl-formatter -p pkl-server -p pkl-repl -p pkl-cli -p pkl-doc -p pkl-wasm -p pkl-host-native --locked
          cargo test -p pkl-runtime --lib --locked
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify

  package-smoke:
    name: Packaging and CLI/Wasm/N-API smoke (Ubuntu x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/m1-tools
            target
          key: cargo-ci-pkg-${{ runner.os }}-wbg-0.2.108-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ci-pkg-${{ runner.os }}-
      - name: Install pinned wasm-bindgen-cli 0.2.108
        run: |
          if [ ! -x .cache/m1-tools/bin/wasm-bindgen ]; then
            cargo install wasm-bindgen-cli --version 0.2.108 --locked --root .cache/m1-tools
          fi
      - name: Build, size-check, and smoke-test @pkl-rs/wasm (includes npm pack install)
        run: |
          node packages/pkl-wasm/scripts/build.mjs
          GZIP_BYTES="$(gzip -9 -c packages/pkl-wasm/dist/wasm/pkl_wasm_bg.wasm | wc -c | tr -d ' ')"
          echo "pkl_wasm_bg.wasm gzip-9 bytes: ${GZIP_BYTES} (limit: 2621440)"
          if [ "${GZIP_BYTES}" -gt 2621440 ]; then
            echo "ERROR: pkl_wasm_bg.wasm gzip-9 size ${GZIP_BYTES} exceeds 2.50 MiB budget (2621440)" >&2
            exit 1
          fi
          node --test packages/pkl-wasm/test/wasm.test.mjs
      - name: Build and smoke-test @pkl-rs/napi
        run: |
          node packages/pkl-napi/scripts/build.mjs
          node packages/pkl-napi/test/run.mjs
          npm pack --dry-run packages/pkl-napi
      - name: Build and smoke-test release pkl and pkldoc CLI binaries
        run: |
          cargo build --release --locked -p pkl-cli --bin pkl -p pkl-doc --bin pkldoc
          ./target/release/pkl --version
          ./target/release/pkldoc --version
          OUT="$(printf 'a = 20 + 22\n' | ./target/release/pkl eval -f json -)"
          echo "${OUT}"
          echo "${OUT}" | grep -q '"a": 42'
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
