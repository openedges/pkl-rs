name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_corpus:
        description: Record the full Java corpus (blocked or failing cases fail this job)
        required: false
        default: false
        type: boolean
      full_benchmarks:
        description: Run full M7 performance & peak RSS benchmark suite and release verifier
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-tooling:
    name: Compatibility tooling and Java replay
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - name: Verify reference source pins
        run: cargo xtask verify
      - name: Check inventories and required smoke inputs
        run: |
          python3 tools/inventory.py --check
          python3 tools/discover.py --check
          python3 tools/smoke_manifest.py --check
          python3 tools/regression_manifest.py --check
          python3 tools/benchmark.py --check-contract
      - name: Test failure detection and measurement tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Bootstrap and replay pinned Java oracle
        run: |
          python3 tools/oracle.py fetch
          python3 tools/oracle.py smoke
      - name: Record required Java smoke corpus
        run: python3 tools/compat.py record --manifest compatibility/smoke.json --output target/m0/ci-baseline
      - name: Verify stored evidence completeness
        run: python3 tools/compat.py check --manifest compatibility/smoke.json --output target/m0/ci-baseline
      - name: Replay Java through candidate comparison (tool verification only)
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'tools')
          from oracle import ensure_oracle
          metadata = ensure_oracle(pathlib.Path.cwd())
          pathlib.Path('target/m0/java-replay.json').write_text(json.dumps({'command': metadata['command'], 'kind': 'java-replay-not-rust'}))
          PY
          python3 tools/compat.py compare --manifest compatibility/smoke.json --expected target/m0/ci-baseline --runner target/m0/java-replay.json --output target/m0/ci-replay
          python3 tools/compat.py check --manifest compatibility/smoke.json --output target/m0/ci-replay
      - name: Record selected historical regressions with Java 0.32.0
        run: |
          python3 tools/compat.py record --manifest compatibility/regressions.json --output target/m0/ci-regressions
          python3 tools/compat.py check --manifest compatibility/regressions.json --output target/m0/ci-regressions
      - name: Record all discovered command cases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_corpus }}
        run: python3 tools/compat.py record --output target/m0/ci-full-corpus
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain raw evidence and execution reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-java-evidence
          path: |
            target/m0/oracle
            target/m0/ci-baseline
            target/m0/ci-replay
            target/m0/ci-regressions
            target/m0/ci-full-corpus
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m1-experiments:
    name: M1 architecture experiments (known gaps recorded)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned browser tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.108 --locked --root .cache/m1-tools
          npm ci --prefix tools/platform --ignore-scripts
          npm exec --prefix tools/platform -- playwright install --with-deps chromium
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Check M1 inventories and evidence tools
        run: |
          python3 tools/m1_frontend.py --check-contract
          python3 tools/m1_semantics.py --check
          python3 -m unittest discover -s tools/tests -p 'test_m1_*.py' -v
      - name: Verify retained Graal compilation evidence (no JDK acquisition)
        shell: bash
        run: |
          python3 tools/evidence.py verify reports/m1/graal-evidence.tar.gz
          python3 tools/evidence.py verify reports/m1/graal-cause-evidence.tar.gz
          mkdir -p target/m1/retained-graal
          tar -xzf reports/m1/graal-evidence.tar.gz -C target/m1/retained-graal
          python3 tools/m1_graal.py --check-report target/m1/retained-graal | tee target/m1/ci-graal-verification.log
      - name: Compare bounded frontend values and parser diagnostics
        run: python3 tools/m1_frontend.py --output target/m1/ci-frontend
      - name: Record runtime values and known diagnostic byte differences
        run: python3 tools/m1_runtime.py --output target/m1/ci-runtime
      - name: Verify actual Java Host lifecycle observations
        run: python3 tools/m1_host.py --output target/m1/ci-host-java
      - name: Compare Java and Rust lazy retry and nested Host evaluation
        run: python3 tools/m1_lifecycle.py --output target/m1/ci-lifecycle
      - name: Run native, Node and actual browser architecture contract
        run: python3 tools/m1_platforms.py --verify-contract --output target/m1/ci-platforms
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M1 source snapshots, artifacts, captures and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-experiment-evidence
          path: target/m1/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify pinned references
        run: cargo xtask verify
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build portable runtime
        run: cargo check -p pkl-runtime --target wasm32-unknown-unknown --locked

  m2-language:
    name: M2 language development (full gate incomplete)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - name: Check full M2 requirement inventory and failure detection
        run: |
          python3 tools/m2_manifest.py --check
          python3 -m unittest discover -s tools/tests -p 'test_m2_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Record raw language comparisons including failures
        run: python3 tools/m2_language.py --output target/m2/ci-language --record-only
      - name: Record same-evaluator class initialization sequences
        run: python3 tools/m2_class_lifecycle.py --output target/m2/ci-class-lifecycle --record-only
      - name: Verify bounded class publication and retry contract
        run: python3 tools/m2_class_lifecycle.py --verify-contract target/m2/ci-class-lifecycle
      - name: Verify generated identifier predicates against pinned Java
        run: python3 tools/m2_identifier_tables.py --output target/m2/ci-identifier
      - name: Verify selected development contract with recorded oracle exceptions
        run: python3 tools/m2_language.py --verify-development target/m2/ci-language
      - name: Strict full M2 completion gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_corpus }}
        run: python3 tools/m2_language.py --verify-full target/m2/ci-language
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M2 source snapshots, artifacts, and raw failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-language-evidence
          path: |
            target/m2/ci-*
            !target/m2/ci-*/build/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m3-stdlib-output:
    name: M3 stdlib, builtins, renderers, and PklBinary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - name: Check M3 manifest and unit tests
        run: |
          python3 tools/m3_manifest.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_m3_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Run M3 mechanical 1,781-item coverage probe
        run: |
          cargo build --release -p pkl-runtime --example m3_coverage_probe --locked
          python3 tools/m3_manifest.py --run-probe target/release/examples/m3_coverage_probe --census-out target/m3/ci-census.json
          python3 tools/m3_manifest.py --verify-coverage target/m3/ci-census.json
      - name: Run M3 3-lane raw-byte differential gate
        run: |
          python3 tools/m3_differential.py --output target/m3/ci-diff
          python3 tools/m3_differential.py --verify-report target/m3/ci-diff
          python3 tools/m3_differential.py --verify-strict target/m3/ci-diff
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M3 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-stdlib-evidence
          path: target/m3/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m4-io-packages:
    name: M4 Host I/O, external readers, projects, and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - name: Check M4 manifest and unit tests
        run: |
          python3 tools/m4_manifest.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_m4_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Run M4 offline differential lanes (Lanes 1-3 on push/PR; all 5 Pantry lanes on full_corpus)
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.full_corpus }}" = "true" ]; then
            python3 tools/m4_differential.py --output target/m4/ci-diff
            python3 tools/m4_differential.py --verify-strict target/m4/ci-diff
            python3 tools/m4_manifest.py --verify-coverage target/m4/ci-diff
          else
            python3 tools/m4_differential.py --lane host-io-http-security --lane external-readers --lane projects-packages-cache --output target/m4/ci-diff
            python3 tools/m4_differential.py --verify-strict target/m4/ci-diff
          fi
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M4 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m4-io-packages-evidence
          path: target/m4/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m5-product-tools:
    name: M5 Rust API, CLI, REPL, server, formatter, and pkldoc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - name: Check M5 manifest and unit tests
        run: |
          python3 tools/m5_manifest.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_m5_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Run M5 5-lane offline differential gate
        run: |
          python3 tools/m5_differential.py --output target/m5/ci-diff
          python3 tools/m5_differential.py --verify-report target/m5/ci-diff
          python3 tools/m5_differential.py --verify-strict target/m5/ci-diff
          python3 tools/m5_manifest.py --verify-coverage target/m5/ci-diff
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M5 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5-product-tools-evidence
          path: target/m5/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m6-wasm-napi:
    name: M6 Wasm and N-API product bindings and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned browser and Wasm tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.108 --locked --root .cache/m1-tools
          npm ci --prefix tools/platform --ignore-scripts
          npm exec --prefix tools/platform -- playwright install --with-deps chromium
      - name: Check M6 manifest, Wasm lint, and unit tests
        run: |
          cargo clippy -p pkl-wasm --target wasm32-unknown-unknown --locked -- -D warnings
          python3 tools/m6_manifest.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_m6_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Run M6 5-lane differential and packaging gate
        run: |
          export PATH="$PWD/.cache/m1-tools/bin:$PATH"
          python3 tools/m6_differential.py --output target/m6/ci-diff
          python3 tools/m6_differential.py --verify-report target/m6/ci-diff
          python3 tools/m6_differential.py --verify-strict target/m6/ci-diff
          python3 tools/m6_manifest.py --verify-coverage target/m6/ci-diff
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M6 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m6-wasm-napi-evidence
          path: target/m6/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  m7-release-gates:
    name: M7 release manifest, soak, fuzz, and benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Check all 12 milestone manifests and M7 tooling tests
        run: |
          python3 tools/inventory.py --check
          python3 tools/discover.py --check
          python3 tools/smoke_manifest.py --check
          python3 tools/regression_manifest.py --check
          python3 tools/m2_manifest.py --check
          python3 tools/m2_module_eval.py --check
          python3 tools/m2_jvm_classpath.py --check
          python3 tools/m3_manifest.py --check
          python3 tools/m4_manifest.py --check
          python3 tools/m5_manifest.py --check
          python3 tools/m6_manifest.py --check
          python3 tools/m7_manifest.py --check
          python3 tools/m7_benchmark.py --check-contract
          PYTHONPATH=tools python3 -m unittest discover -s tools/tests -p 'test_m7_*.py' -v
      - name: Bootstrap pinned Java oracle
        run: python3 tools/oracle.py fetch
      - name: Run M7 seeded differential fuzzer
        run: |
          PYTHONPATH=tools python3 tools/m7_fuzz.py --output target/m7/ci-fuzz --count 210 --replay-regressions tests/fixtures/m7/fuzz-regressions
          PYTHONPATH=tools python3 tools/m7_fuzz.py --verify-strict target/m7/ci-fuzz
      - name: Run M7 long-running memory reclamation soak (native)
        run: |
          PYTHONPATH=tools python3 tools/m7_memory_soak.py --target native --profile quick --record-only --output target/m7/ci-soak-native
          PYTHONPATH=tools python3 tools/m7_memory_soak.py --verify-report target/m7/ci-soak-native
          python3 - <<'PY'
          import json, pathlib, sys
          rep = json.loads(pathlib.Path("target/m7/ci-soak-native/report.json").read_bytes())
          if rep.get("error_count", 1) != 0 or rep.get("leak_detected_count", 1) != 0 or rep.get("bounded_count", 0) != 6:
              print("Native quick soak failed:", rep.get("verdict_counts"), file=sys.stderr)
              sys.exit(1)
          print("Native quick soak clean:", rep.get("verdict_counts"))
          PY
      - name: Run full M7 performance and peak RSS benchmark suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_benchmarks }}
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.108 --locked --root .cache/m1-tools
          npm ci --prefix tools/platform --ignore-scripts
          if [ "${{ runner.os }}" = "Linux" ]; then
            npm exec --prefix tools/platform -- playwright install --with-deps chromium
          else
            npm exec --prefix tools/platform -- playwright install chromium
          fi
          export PATH="$PWD/.cache/m1-tools/bin:$PATH"
          node packages/pkl-wasm/scripts/build.mjs
          node packages/pkl-napi/scripts/build.mjs
          PYTHONPATH=tools python3 tools/m7_memory_soak.py --profile standard --output target/m7/ci-soak-full
          PYTHONPATH=tools python3 tools/m7_benchmark.py --profile full --output target/m7/ci-bench-full
          PYTHONPATH=tools python3 tools/m7_benchmark.py --verify-report target/m7/ci-bench-full
          PYTHONPATH=tools python3 tools/m7_manifest.py --benchmark-dir target/m7/ci-bench-full --soak-dir target/m7/ci-soak-full --fuzz-dir target/m7/ci-fuzz --local-checkpoint
      - name: Confirm reference checkouts remain clean
        if: ${{ always() }}
        run: cargo xtask verify
      - name: Retain M7 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m7-release-evidence-${{ matrix.os }}
          path: target/m7/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
