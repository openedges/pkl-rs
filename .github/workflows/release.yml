name: Release

# Cross-platform packaging and distribution workflow.
# Runs ONLY on version tags (`v*`) or explicit manual dispatch — never on
# ordinary push or pull_request commits.
#
# Produces:
# - Portable Linux glibc <= 2.28 and static musl CLI archives (`pkl`, `pkldoc`)
#   for x86_64 and aarch64, smoke-tested across Debian 12, Rocky 9, Ubuntu 22.04,
#   and Alpine 3.21.
# - macOS (arm64, x64) and Windows (x64) CLI archives (`pkl`, `pkldoc`).
# - Publishable `@openedges/pkl-wasm` npm tarball (verified gzip-9 <= 2.50 MiB).
# - Multi-platform `@openedges/pkl-napi` npm tarball bundling all 7 native `.node` addons.
# - Verified `.crate` packaging for all 8 crates.io workspace crates.
# - Deterministic Homebrew Formula (`Formula/pkl-rs.rb`) rendered from `SHA256SUMS.txt`.
# - `SHA256SUMS.txt` covering every release archive and npm tarball.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag label when running manually (e.g. v0.32.0-rc.1; defaults to dry-run snapshot label)
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Create/update a GitHub Release and upload packaged assets (always true on v* tags)
        required: false
        default: false
        type: boolean
      publish_npm:
        description: Publish @openedges/pkl-wasm and @openedges/pkl-napi tarballs to npm (requires NPM_TOKEN secret)
        required: false
        default: false
        type: boolean
      publish_crates:
        description: Publish all 8 workspace crates to crates.io in topological order (requires CARGO_REGISTRY_TOKEN secret)
        required: false
        default: false
        type: boolean
      publish_homebrew:
        description: Update Formula/pkl-rs.rb in the Homebrew tap repository (requires HOMEBREW_TAP_TOKEN secret)
        required: false
        default: false
        type: boolean
      homebrew_tap_repo:
        description: Target Homebrew tap repository (owner/repo)
        required: false
        default: 'openedges/homebrew-tap'
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag and manifest version lockstep
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            Cargo.toml
            packages/pkl-wasm/package.json
            packages/pkl-napi/package.json
            tools/check_release_version.py
          sparse-checkout-cone-mode: false
      - name: Verify Cargo/npm version lockstep and tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python3 tools/check_release_version.py --tag "${GITHUB_REF}"
          elif [ -n "${{ inputs.tag }}" ]; then
            python3 tools/check_release_version.py --tag "${{ inputs.tag }}"
          else
            python3 tools/check_release_version.py
          fi

  package-linux-portable:
    name: Package Linux portable glibc 2.28 + static musl (${{ matrix.arch }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            node_arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Free disk space on Ubuntu x64 runners
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Build glibc 2.28 compatible pkl, pkldoc, and @openedges/pkl-napi (manylinux_2_28)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dist-linux-gnu-228
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -e NODE_ARCH="${{ matrix.node_arch }}" \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/dist-linux-gnu-228:/out" \
            "quay.io/pypa/manylinux_2_28_${{ matrix.arch }}" \
            bash -euo pipefail -c '
              export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo CARGO_TARGET_DIR=/tmp/target
              curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
              export PATH="/tmp/cargo/bin:$PATH"
              mkdir -p /tmp/src
              cp -a /work/Cargo.toml /work/Cargo.lock /work/rust-toolchain.toml /work/LICENSE /work/NOTICE /work/THIRD-PARTY-NOTICES.md /work/crates /work/packages /work/xtask /work/tools /tmp/src/
              cd /tmp/src
              cargo build --release --locked -p pkl-cli -p pkl-doc -p pkl-napi
              cp /tmp/target/release/pkl /out/pkl
              cp /tmp/target/release/pkldoc /out/pkldoc
              cp /tmp/target/release/libpkl_napi.so "/out/pkl_napi.linux-${NODE_ARCH}-gnu.node"
              python3 /tmp/src/tools/check_linux_glibc.py --max-glibc 2.28 /out/pkl /out/pkldoc "/out/pkl_napi.linux-${NODE_ARCH}-gnu.node"
              chown -R "${HOST_UID}:${HOST_GID}" /out
            '
      - name: Build static musl pkl, pkldoc, and Alpine musl @openedges/pkl-napi (alpine:3.21)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dist-linux-musl
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -e NODE_ARCH="${{ matrix.node_arch }}" \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/dist-linux-musl:/out" \
            node:22-alpine3.21 \
            sh -eu -c '
              apk add --no-cache bash curl gcc musl-dev binutils
              export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo CARGO_TARGET_DIR=/tmp/target
              curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
              export PATH="/tmp/cargo/bin:$PATH"
              mkdir -p /tmp/src
              cp -a /work/Cargo.toml /work/Cargo.lock /work/rust-toolchain.toml /work/LICENSE /work/NOTICE /work/THIRD-PARTY-NOTICES.md /work/crates /work/packages /work/xtask /work/tools /tmp/src/
              cd /tmp/src
              RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p pkl-cli -p pkl-doc
              cp /tmp/target/release/pkl /out/pkl
              cp /tmp/target/release/pkldoc /out/pkldoc
              if readelf -l /out/pkl | grep -q INTERP; then
                echo "ERROR: musl pkl binary is not statically linked" >&2
                exit 1
              fi
              if readelf -l /out/pkldoc | grep -q INTERP; then
                echo "ERROR: musl pkldoc binary is not statically linked" >&2
                exit 1
              fi
              RUSTFLAGS="-C target-feature=-crt-static" CARGO_TARGET_DIR=/tmp/target-napi node packages/pkl-napi/scripts/build.mjs
              node packages/pkl-napi/test/run.mjs
              cp "packages/pkl-napi/native/pkl_napi.linux-${NODE_ARCH}-musl.node" "/out/pkl_napi.linux-${NODE_ARCH}-musl.node"
              chown -R "${HOST_UID}:${HOST_GID}" /out
            '
      - name: Smoke-test Linux binaries across Debian 12, Rocky Linux 9, Ubuntu 22.04, and Alpine 3.21
        shell: bash
        run: |
          set -euo pipefail
          NODE_ARCH="${{ matrix.node_arch }}"
          for IMG in node:22-bookworm-slim rockylinux:9-minimal ubuntu:22.04; do
            echo "=== Smoke-testing glibc 2.28 + static musl CLI on ${IMG} ==="
            docker run --rm \
              -v "$PWD/target/dist-linux-gnu-228:/gnu:ro" \
              -v "$PWD/target/dist-linux-musl:/musl:ro" \
              "$IMG" sh -eu -c '
                /gnu/pkl --version
                /gnu/pkldoc --version
                printf "a = 1 + 2\n" | /gnu/pkl eval -f json - | grep -q "\"a\": 3"
                /musl/pkl --version
                /musl/pkldoc --version
                printf "a = 20 + 22\n" | /musl/pkl eval -f json - | grep -q "\"a\": 42"
              '
          done
          echo "=== Smoke-testing glibc 2.28 @openedges/pkl-napi on Debian 12 ==="
          docker run --rm \
            -e NODE_ARCH="$NODE_ARCH" \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/dist-linux-gnu-228:/gnu:ro" \
            node:22-bookworm-slim \
            sh -eu -c '
              cp -a /work/packages/pkl-napi /tmp/pkl-napi
              mkdir -p /tmp/pkl-napi/dist /tmp/pkl-napi/native
              cp /tmp/pkl-napi/src/runtime.cjs /tmp/pkl-napi/dist/index.cjs
              cp /tmp/pkl-napi/src/index.mjs /tmp/pkl-napi/dist/index.mjs
              cp /tmp/pkl-napi/src/index.d.ts /tmp/pkl-napi/dist/index.d.ts
              cp "/gnu/pkl_napi.linux-${NODE_ARCH}-gnu.node" "/tmp/pkl-napi/native/pkl_napi.linux-${NODE_ARCH}-gnu.node"
              node /tmp/pkl-napi/test/run.mjs
            '
          echo "=== Smoke-testing static musl CLI + musl @openedges/pkl-napi on Alpine 3.21 ==="
          docker run --rm \
            -e NODE_ARCH="$NODE_ARCH" \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/dist-linux-musl:/musl:ro" \
            node:22-alpine3.21 \
            sh -eu -c '
              /musl/pkl --version
              /musl/pkldoc --version
              printf "a = 6 * 7\n" | /musl/pkl eval -f json - | grep -q "\"a\": 42"
              cp -a /work/packages/pkl-napi /tmp/pkl-napi
              mkdir -p /tmp/pkl-napi/dist /tmp/pkl-napi/native
              cp /tmp/pkl-napi/src/runtime.cjs /tmp/pkl-napi/dist/index.cjs
              cp /tmp/pkl-napi/src/index.mjs /tmp/pkl-napi/dist/index.mjs
              cp /tmp/pkl-napi/src/index.d.ts /tmp/pkl-napi/dist/index.d.ts
              cp "/musl/pkl_napi.linux-${NODE_ARCH}-musl.node" "/tmp/pkl-napi/native/pkl_napi.linux-${NODE_ARCH}-musl.node"
              node /tmp/pkl-napi/test/run.mjs
            '
      - name: Archive Linux CLI release tarballs and collect N-API addons
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.node_arch }}"
          mkdir -p target/release-stage/cli target/release-stage/napi
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md target/dist-linux-gnu-228/
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md target/dist-linux-musl/
          tar -czf "target/release-stage/cli/pkl-linux-${ARCH}-gnu.tar.gz" -C target/dist-linux-gnu-228 pkl LICENSE NOTICE THIRD-PARTY-NOTICES.md
          tar -czf "target/release-stage/cli/pkldoc-linux-${ARCH}-gnu.tar.gz" -C target/dist-linux-gnu-228 pkldoc LICENSE NOTICE THIRD-PARTY-NOTICES.md
          tar -czf "target/release-stage/cli/pkl-linux-${ARCH}-musl.tar.gz" -C target/dist-linux-musl pkl LICENSE NOTICE THIRD-PARTY-NOTICES.md
          tar -czf "target/release-stage/cli/pkldoc-linux-${ARCH}-musl.tar.gz" -C target/dist-linux-musl pkldoc LICENSE NOTICE THIRD-PARTY-NOTICES.md
          cp "target/dist-linux-gnu-228/pkl_napi.linux-${ARCH}-gnu.node" target/release-stage/napi/
          cp "target/dist-linux-musl/pkl_napi.linux-${ARCH}-musl.node" target/release-stage/napi/
      - name: Upload Linux packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.node_arch }}
          path: target/release-stage
          if-no-files-found: error
          retention-days: 14

  package-macos-windows:
    name: Package CLI and @openedges/pkl-napi (${{ matrix.target_label }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target_label: darwin-arm64
            addon_name: pkl_napi.darwin-arm64.node
            archive_ext: tar.gz
          - os: macos-15-intel
            target_label: darwin-x64
            addon_name: pkl_napi.darwin-x64.node
            archive_ext: tar.gz
          - os: windows-latest
            target_label: win32-x64
            addon_name: pkl_napi.win32-x64.node
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rel-${{ matrix.target_label }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rel-${{ matrix.target_label }}-
      - name: Build and smoke-test release pkl and pkldoc binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p pkl-cli --bin pkl -p pkl-doc --bin pkldoc
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          "./target/release/pkl${EXE}" --version
          "./target/release/pkldoc${EXE}" --version
          OUT="$(printf 'a = 20 + 22\n' | "./target/release/pkl${EXE}" eval -f json -)"
          echo "${OUT}"
          echo "${OUT}" | grep -q '"a": 42'
      - name: Build and smoke-test @openedges/pkl-napi
        shell: bash
        run: |
          set -euo pipefail
          node packages/pkl-napi/scripts/build.mjs
          node packages/pkl-napi/test/run.mjs
          test -f "packages/pkl-napi/native/${{ matrix.addon_name }}"
      - name: Archive CLI release binaries and collect N-API addon
        shell: bash
        run: |
          set -euo pipefail
          LABEL="${{ matrix.target_label }}"
          mkdir -p target/release-stage/cli target/release-stage/napi target/release-cli-bundle
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md target/release-cli-bundle/
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            cp target/release/pkl target/release/pkldoc target/release-cli-bundle/
            tar -czf "target/release-stage/cli/pkl-${LABEL}.tar.gz" -C target/release-cli-bundle pkl LICENSE NOTICE THIRD-PARTY-NOTICES.md
            tar -czf "target/release-stage/cli/pkldoc-${LABEL}.tar.gz" -C target/release-cli-bundle pkldoc LICENSE NOTICE THIRD-PARTY-NOTICES.md
          else
            cp target/release/pkl.exe target/release/pkldoc.exe target/release-cli-bundle/
            pwsh -NoProfile -Command "Compress-Archive -Path 'target/release-cli-bundle/pkl.exe','target/release-cli-bundle/LICENSE','target/release-cli-bundle/NOTICE','target/release-cli-bundle/THIRD-PARTY-NOTICES.md' -DestinationPath 'target/release-stage/cli/pkl-${LABEL}.zip' -Force"
            pwsh -NoProfile -Command "Compress-Archive -Path 'target/release-cli-bundle/pkldoc.exe','target/release-cli-bundle/LICENSE','target/release-cli-bundle/NOTICE','target/release-cli-bundle/THIRD-PARTY-NOTICES.md' -DestinationPath 'target/release-stage/cli/pkldoc-${LABEL}.zip' -Force"
          fi
          cp "packages/pkl-napi/native/${{ matrix.addon_name }}" target/release-stage/napi/
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target_label }}
          path: target/release-stage
          if-no-files-found: error
          retention-days: 14

  package-wasm:
    name: Package @openedges/pkl-wasm (wasm-release)
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/m1-tools
            target
          key: cargo-rel-wasm-wbg-0.2.108-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rel-wasm-
      - name: Install pinned wasm-bindgen-cli 0.2.108
        run: |
          if [ ! -x .cache/m1-tools/bin/wasm-bindgen ]; then
            cargo install wasm-bindgen-cli --version 0.2.108 --locked --root .cache/m1-tools
          fi
      - name: Build, size-check, test, and pack @openedges/pkl-wasm
        run: |
          set -euo pipefail
          node packages/pkl-wasm/scripts/build.mjs
          GZIP_BYTES="$(gzip -9 -c packages/pkl-wasm/dist/wasm/pkl_wasm_bg.wasm | wc -c | tr -d ' ')"
          echo "pkl_wasm_bg.wasm gzip-9 bytes: ${GZIP_BYTES} (limit: 2621440)"
          if [ "${GZIP_BYTES}" -gt 2621440 ]; then
            echo "ERROR: pkl_wasm_bg.wasm gzip-9 size ${GZIP_BYTES} exceeds 2.50 MiB budget (2621440)" >&2
            exit 1
          fi
          node --test packages/pkl-wasm/test/wasm.test.mjs
          mkdir -p target/release-stage/npm
          npm pack ./packages/pkl-wasm --pack-destination target/release-stage/npm
      - name: Upload @openedges/pkl-wasm tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wasm
          path: target/release-stage
          if-no-files-found: error
          retention-days: 14

  package-crates:
    name: Verify crates.io packaging for all 8 publishable crates
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rel-crates-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rel-crates-
      - name: Package and verify crates.io tarballs (all 8 crates <= 10 MiB)
        shell: bash
        run: |
          set -euo pipefail
          # Full standalone compile verification for root crates with zero internal deps
          cargo package --locked -p pkl-runtime -p pkl-formatter
          # Multi-crate packaging for all 8 crates together (resolves unpublished workspace deps)
          cargo package --no-verify --locked \
            -p pkl-runtime \
            -p pkl-formatter \
            -p pkl-host-native \
            -p pkl-lang \
            -p pkl-repl \
            -p pkl-server \
            -p pkl-doc \
            -p pkl-cli
          for FILE in target/package/*.crate; do
            SIZE="$(wc -c < "${FILE}" | tr -d ' ')"
            echo "${FILE}: ${SIZE} bytes (limit: 10485760)"
            if [ "${SIZE}" -gt 10485760 ]; then
              echo "ERROR: ${FILE} exceeds crates.io 10 MiB limit (${SIZE} bytes)" >&2
              exit 1
            fi
          done

  assemble-and-release:
    name: Assemble multi-platform release bundle, checksums, and publish
    needs:
      - package-linux-portable
      - package-macos-windows
      - package-wasm
      - package-crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Preserve reference fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            /*
            !/reports/m2/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Download all packaged platform artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: target/downloaded-release
      - name: Assemble multi-platform @openedges/pkl-napi tarball, checksums, and Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-bundle packages/pkl-napi/dist packages/pkl-napi/native
          cp packages/pkl-napi/src/runtime.cjs packages/pkl-napi/dist/index.cjs
          cp packages/pkl-napi/src/index.mjs packages/pkl-napi/dist/index.mjs
          cp packages/pkl-napi/src/index.d.ts packages/pkl-napi/dist/index.d.ts
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md packages/pkl-napi/

          # Copy all CLI archives and @openedges/pkl-wasm tarball into final release-bundle
          find target/downloaded-release -path '*/cli/*' -type f -exec cp {} target/release-bundle/ \;
          find target/downloaded-release -path '*/npm/*.tgz' -type f -exec cp {} target/release-bundle/ \;

          # Collect all 7 platform .node addons into packages/pkl-napi/native
          find target/downloaded-release -path '*/napi/*.node' -type f -exec cp {} packages/pkl-napi/native/ \;
          for ADDON in \
            pkl_napi.darwin-arm64.node \
            pkl_napi.darwin-x64.node \
            pkl_napi.linux-x64-gnu.node \
            pkl_napi.linux-arm64-gnu.node \
            pkl_napi.linux-x64-musl.node \
            pkl_napi.linux-arm64-musl.node \
            pkl_napi.win32-x64.node; do
            if [ ! -f "packages/pkl-napi/native/${ADDON}" ]; then
              echo "ERROR: missing required @openedges/pkl-napi addon: ${ADDON}" >&2
              exit 1
            fi
          done

          npm pack ./packages/pkl-napi --pack-destination target/release-bundle
          rm -rf packages/pkl-napi/dist packages/pkl-napi/native packages/pkl-napi/LICENSE packages/pkl-napi/NOTICE packages/pkl-napi/THIRD-PARTY-NOTICES.md
          (cd target/release-bundle && sha256sum *.tar.gz *.zip *.tgz | sort -k2 > SHA256SUMS.txt)

          VERSION="$(python3 -c 'import json, subprocess; d = json.loads(subprocess.check_output(["python3", "tools/check_release_version.py"], text=True)); print(d["versions"]["Cargo.toml"])')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            FORMULA_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            FORMULA_TAG="${{ inputs.tag }}"
          else
            FORMULA_TAG="v${VERSION}"
          fi
          python3 tools/render_homebrew_formula.py \
            --version "${VERSION}" \
            --tag "${FORMULA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --checksums target/release-bundle/SHA256SUMS.txt \
            --output target/release-bundle/Formula/pkl-rs.rb
          ruby -c target/release-bundle/Formula/pkl-rs.rb

          ls -lh target/release-bundle
          cat target/release-bundle/SHA256SUMS.txt
      - name: Upload consolidated release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: target/release-bundle
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            echo "ERROR: manual publish_github_release requires a non-empty 'tag' input (e.g. v0.32.0-rc.1)" >&2
            exit 1
          fi
          EXTRA_FLAGS=()
          if [ "${{ inputs.prerelease }}" = "true" ] || [[ "${TAG}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          ASSETS=(
            target/release-bundle/*.tar.gz
            target/release-bundle/*.zip
            target/release-bundle/*.tgz
            target/release-bundle/SHA256SUMS.txt
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "pkl-rs ${TAG}" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
      - name: Publish @openedges/pkl-wasm and @openedges/pkl-napi tarballs to npm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "ERROR: publish_npm=true requested, but NPM_TOKEN secret is not configured" >&2
            exit 1
          fi
          VERSION="$(python3 -c 'import json, subprocess; d = json.loads(subprocess.check_output(["python3", "tools/check_release_version.py"], text=True)); print(d["versions"]["Cargo.toml"])')"
          DIST_TAG_ARGS=()
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG_ARGS=(--tag next)
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          chmod 600 "${HOME}/.npmrc"
          for TGZ in target/release-bundle/openedges-pkl-wasm-*.tgz target/release-bundle/openedges-pkl-napi-*.tgz; do
            npm publish "${TGZ}" --access public "${DIST_TAG_ARGS[@]}"
          done
      - name: Publish Homebrew formula to tap repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_homebrew }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ inputs.homebrew_tap_repo }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "ERROR: publish_homebrew=true requested, but HOMEBREW_TAP_TOKEN secret is not configured" >&2
            exit 1
          fi
          VERSION="$(python3 -c 'import json, subprocess; d = json.loads(subprocess.check_output(["python3", "tools/check_release_version.py"], text=True)); print(d["versions"]["Cargo.toml"])')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          python3 tools/check_release_version.py --tag "${TAG}"

          # Always anchor Formula checksums to the live GitHub Release when not uploaded in this run.
          CHECKSUMS_PATH="target/release-bundle/SHA256SUMS.txt"
          if [ "${{ inputs.publish_github_release }}" != "true" ]; then
            mkdir -p target/homebrew-release-checksums
            gh release download "${TAG}" -p SHA256SUMS.txt -D target/homebrew-release-checksums --clobber
            CHECKSUMS_PATH="target/homebrew-release-checksums/SHA256SUMS.txt"
          fi

          TAP_DIR="/tmp/homebrew-tap"
          rm -rf "${TAP_DIR}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" "${TAP_DIR}"
          mkdir -p "${TAP_DIR}/Formula"
          python3 tools/render_homebrew_formula.py \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --checksums "${CHECKSUMS_PATH}" \
            --output "${TAP_DIR}/Formula/pkl-rs.rb"
          ruby -c "${TAP_DIR}/Formula/pkl-rs.rb"

          cd "${TAP_DIR}"
          git config user.name "pkl-rs-release-bot"
          git config user.email "pkl-rs-release-bot@users.noreply.github.com"
          git add Formula/pkl-rs.rb
          if git diff --cached --quiet; then
            echo "Formula/pkl-rs.rb is already up to date for ${VERSION}."
          else
            git commit -m "pkl-rs ${VERSION}"
            git push origin HEAD
          fi
      - name: Publish all 8 workspace crates to crates.io
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "ERROR: publish_crates=true requested, but CARGO_REGISTRY_TOKEN secret is not configured" >&2
            exit 1
          fi
          rustup show active-toolchain
          CRATES=(
            pkl-runtime
            pkl-formatter
            pkl-host-native
            pkl-lang
            pkl-repl
            pkl-server
            pkl-doc
            pkl-cli
          )
          for CRATE in "${CRATES[@]}"; do
            PUBLISHED=0
            for ATTEMPT in 1 2 3 4 5; do
              echo "Publishing ${CRATE} (attempt ${ATTEMPT}/5)..."
              LOG_FILE="/tmp/cargo-publish-${CRATE}.log"
              if cargo publish --locked -p "${CRATE}" 2>&1 | tee "${LOG_FILE}"; then
                PUBLISHED=1
                break
              fi
              if grep -q "already exists on crates.io index" "${LOG_FILE}"; then
                echo "${CRATE} already exists at this version on crates.io; continuing."
                PUBLISHED=1
                break
              fi
              if [ "${ATTEMPT}" -lt 5 ]; then
                echo "Waiting 25s for crates.io sparse index propagation before retrying ${CRATE}..."
                sleep 25
              fi
            done
            if [ "${PUBLISHED}" -ne 1 ]; then
              echo "ERROR: failed to publish ${CRATE} after 5 attempts" >&2
              exit 1
            fi
            sleep 15
          done
